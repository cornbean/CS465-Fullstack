<div *ngIf="isLoggedIn()">
    <button (click)="addTrip()" class="btn btn-info">Add Trip</button>
</div>

<div class="row">
    <div *ngFor="let trip of trips" class="col-md-4 mt-2">
        <app-trip-card [trip]="trip" (tripDeleted)="handleDelete($event)"></app-trip-card>
    </div>
</div>
